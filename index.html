<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Splitter</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#f4f4f9;
    padding:10px;
}
div {
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
input, select, button {
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
}
button {
    background:#5cb85c;
    color:white;
    border:none;
    cursor:pointer;
}
button:hover { background:#4cae4c; }
table {
    width:100%;
    border-collapse:collapse;
}
th, td {
    padding:8px;
    border-bottom:1px solid #ddd;
}
.split-row {
    display:flex;
    align-items:center;
    gap:10px;
}
.ratioInput {
    width:70px;
}
</style>
</head>

<body>

<h1>Expense Splitter</h1>

<!-- USERS -->
<div>
<h2>Add User</h2>
<input id="username" placeholder="Enter user name">
<button id="addUserBtn">Add User</button>

<table id="users-table">
<tr><th>User</th></tr>
</table>
</div>

<!-- EXPENSE -->
<div>
<h2>Add Expense</h2>

<label>Who paid?</label>
<select id="whoPaid"></select>

<label>Amount</label>
<input id="amount" type="number" step="0.01">

<label>Reason</label>
<input id="reason">

<label>Split Between (with ratios)</label>
<div id="splitBetweenContainer"></div>

<button id="addExpenseBtn">Add Expense</button>

<table id="expenses-table">
<tr>
<th>Who Paid</th>
<th>Amount</th>
<th>Reason</th>
<th>Split Between</th>
<th>Action</th>
</tr>
</table>
</div>

<!-- SETTLEMENT -->
<div>
<h2>Settlements</h2>
<button id="calculateBtn">Calculate</button>
<div id="settlements"></div>
</div>

<script>

let users = [];
let expenses = [];

/* -------- DOM REFERENCES -------- */

const usernameInput = document.getElementById("username");
const usersTable = document.getElementById("users-table");
const whoPaidSelect = document.getElementById("whoPaid");
const amountInput = document.getElementById("amount");
const reasonInput = document.getElementById("reason");
const splitBetweenContainer = document.getElementById("splitBetweenContainer");
const expensesTable = document.getElementById("expenses-table");
const settlementsDiv = document.getElementById("settlements");

document.getElementById("addUserBtn").addEventListener("click", addUser);
document.getElementById("addExpenseBtn").addEventListener("click", addExpense);
document.getElementById("calculateBtn").addEventListener("click", calculateSettlements);


/* -------- USERS -------- */

function addUser(){
    const name = usernameInput.value.trim();
    if(!name || users.includes(name)) return;

    users.push(name);
    usersTable.innerHTML += `<tr><td>${name}</td></tr>`;
    usernameInput.value="";
    updateSelectOptions();
}

function updateSelectOptions(){
    whoPaidSelect.innerHTML =
        users.map(u=>`<option value="${u}">${u}</option>`).join("");

    splitBetweenContainer.innerHTML =
        users.map(u=>`
        <div class="split-row">
          <input type="checkbox" class="splitUser" value="${u}">
          <span>${u}</span>
          <input class="ratioInput" value="1">
        </div>
        `).join("");

    document.querySelectorAll(".splitUser").forEach(cb=>{
        cb.addEventListener("change", function(){
            autoFillRatio(this);
        });
    });
}


/* -------- AUTO FILL RATIO -------- */

function autoFillRatio(checkbox){
    const ratioField = checkbox.parentElement.querySelector(".ratioInput");
    ratioField.value = checkbox.checked ? "1" : "";
}


/* -------- FRACTION PARSER -------- */

function parseRatio(val){
    if(!val) return 1;
    if(val.includes("/")){
        const [a,b] = val.split("/").map(Number);
        if(!isNaN(a) && !isNaN(b) && b!==0) return a/b;
        return 1;
    }
    const n = parseFloat(val);
    return isNaN(n) ? 1 : n;
}


/* -------- ADD EXPENSE -------- */

function addExpense(){

    const whoPaidVal = whoPaidSelect.value;
    const amt = parseFloat(amountInput.value);
    const reasonVal = reasonInput.value;

    const selected = [...document.querySelectorAll(".splitUser:checked")]
        .map(cb=>{
            const ratioText =
              cb.parentElement.querySelector(".ratioInput").value;
            return {
                name: cb.value,
                ratio: parseRatio(ratioText)
            };
        });

    if(!whoPaidVal || isNaN(amt) || !reasonVal || selected.length===0) return;

    expenses.push({
        whoPaid: whoPaidVal,
        amount: amt,
        reason: reasonVal,
        splitBetween: selected
    });

    amountInput.value="";
    reasonInput.value="";
    updateExpensesTable();
}


/* -------- EXPENSE TABLE -------- */

function updateExpensesTable(){

    expensesTable.innerHTML = `
    <tr>
    <th>Who Paid</th>
    <th>Amount</th>
    <th>Reason</th>
    <th>Split Between</th>
    <th>Action</th>
    </tr>
    `;

    expenses.forEach((e,i)=>{
        expensesTable.innerHTML += `
        <tr>
          <td>${e.whoPaid}</td>
          <td>₹${e.amount.toFixed(2)}</td>
          <td>${e.reason}</td>
          <td>${e.splitBetween.map(p=>`${p.name} (${p.ratio.toFixed(2)})`).join(", ")}</td>
          <td><button onclick="removeExpense(${i})">Remove</button></td>
        </tr>`;
    });
}

function removeExpense(i){
    expenses.splice(i,1);
    updateExpensesTable();
}


/* -------- SETTLEMENT -------- */

function calculateSettlements(){

    const balances = {};
    users.forEach(u=>balances[u]=0);

    expenses.forEach(e=>{
        const totalRatio =
            e.splitBetween.reduce((s,p)=>s+p.ratio,0);

        e.splitBetween.forEach(p=>{
            const share = e.amount * (p.ratio / totalRatio);
            if(p.name !== e.whoPaid){
                balances[p.name] -= share;
                balances[e.whoPaid] += share;
            }
        });
    });

    const debtors = Object.keys(balances).filter(u=>balances[u]<0);
    const creditors = Object.keys(balances).filter(u=>balances[u]>0);

    let html = `<table>
    <tr><th>Debtor</th><th>Creditor</th><th>Amount</th></tr>`;

    debtors.forEach(d=>{
        creditors.forEach(c=>{
            if(balances[d]<0 && balances[c]>0){
                const amt = Math.min(-balances[d], balances[c]);
                if(amt>0){
                    html+=`
                    <tr>
                      <td>${d}</td>
                      <td>${c}</td>
                      <td>₹${amt.toFixed(2)}</td>
                    </tr>`;
                    balances[d]+=amt;
                    balances[c]-=amt;
                }
            }
        });
    });

    html+="</table>";
    settlementsDiv.innerHTML = html;
}

</script>

</body>
</html>
